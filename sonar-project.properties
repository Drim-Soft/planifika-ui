# SonarQube Configuration for Next.js Project
sonar.projectKey=FRONT
sonar.projectName=FRONT
sonar.projectVersion=1.0.0

# Source encoding
sonar.sourceEncoding=UTF-8

# Source directories (Next.js structure)
sonar.sources=app,middleware.ts,next.config.ts

# Exclude node_modules, build files, and other non-source files
sonar.exclusions=**/node_modules/**,**/.next/**,**/out/**,**/build/**,**/dist/**,**/*.config.js,**/*.config.mjs,**/*.config.ts,**/coverage/**,**/public/**,**/*.d.ts,**/tsconfig.tsbuildinfo

# Test directories (if you have tests)
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/__tests__/**

# Coverage reports (if you have coverage)
# sonar.javascript.lcov.reportPaths=coverage/lcov.info
# sonar.typescript.lcov.reportPaths=coverage/lcov.info

# SonarQube server configuration
sonar.host.url=http://localhost:9000
sonar.login=sqp_903b72156c68a45e52565a576e139ab0baae13b1

# Additional TypeScript/JavaScript settings
sonar.typescript.file.suffixes=.ts,.tsx
sonar.javascript.file.suffixes=.js,.jsx

# Quality gate
sonar.qualitygate.wait=true
